name: BibleDaily
options:
  bundleIdPrefix: com.robertlangat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID here (or in Xcode) to sign for devices
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
targets:
  BibleDaily:
    type: application
    platform: iOS
    sources:
      - path: BibleDaily
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertlangat.bibledaily
        PRODUCT_NAME: BibleDaily
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ENABLE_PREVIEWS: YES
    info:
      path: BibleDaily/Info.plist
      properties:
        CFBundleDisplayName: Bible Daily
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # AdMob — Google's iOS TEST app ID. Replace with your iOS AdMob App ID before release
        # (and the unit IDs in BibleDaily/Ads/AdConfig.swift).
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: Your data will be used to show you more relevant ads. Bible Daily works fully without tracking.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
  BibleDailyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BibleDailyTests]
    dependencies:
      - target: BibleDaily
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.robertlangat.bibledaily.tests
  BibleDailyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BibleDailyUITests]
    dependencies:
      - target: BibleDaily
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.robertlangat.bibledaily.uitests
        TEST_TARGET_NAME: BibleDaily
schemes:
  BibleDaily:
    build:
      targets:
        BibleDaily: all
    test:
      gatherCoverageData: false
      targets:
        - BibleDailyTests
        - BibleDailyUITests
