name: iOS build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project BibleDaily.xcodeproj -scheme BibleDaily | tail -20

      - name: Pick an iPhone simulator
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              m=re.search(r"iOS-(\d+)-(\d+)",rt)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for x in devs:
                  if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]:
                      if best is None or v>best[0]: best=(v,x["udid"],x["name"])
          print(best[1]); print(best, file=sys.stderr)')
          echo "SIM_ID=$ID" >> $GITHUB_ENV

      - name: Build and run unit + UI tests on the simulator
        run: |
          set -o pipefail
          xcodebuild test -project BibleDaily.xcodeproj -scheme BibleDaily \
            -destination "id=$SIM_ID" -resultBundlePath results.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-test.log | grep -E "error:|warning: unre|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-test.log

      - name: Build for a real iPhone (Release, unsigned)
        if: always()
        run: |
          set -o pipefail
          xcodebuild archive -project BibleDaily.xcodeproj -scheme BibleDaily -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/BibleDaily.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
          du -sh build/BibleDaily.xcarchive/Products/Applications/BibleDaily.app

      - name: Collect screenshots and test summary
        if: always()
        run: |
          mkdir -p out/screenshots
          xcrun xcresulttool export attachments --path results.xcresult --output-path out/screenshots || true
          ls out/screenshots | head -40
          grep -E "Test Case .*(passed|failed)|Executed .* tests|error:" xcodebuild-test.log > out/test-summary.txt || true
          grep -E "error:" archive.log > out/archive-errors.txt || true
          xcodebuild -version > out/xcode-version.txt
          cat out/test-summary.txt | tail -40

      - name: Publish output to the ios-ci-artifacts branch
        if: always()
        run: |
          cd out
          git init -q -b ios-ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "iOS CI output for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git add -A && git commit -qm "iOS CI output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ios-ci-artifacts

      - name: Commit the generated Xcode project
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git add -f BibleDaily.xcodeproj
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Update generated Xcode project [skip ci]"
            git push
          fi
